site_name: CodaCode Database
site_url: https://hwidjaja11.github.io/CodaCodeDatabase/
use_directory_urls: false
theme:
  name: material
  logo: images/CodaCodeOfficialLogo.png
  favicon: images/CodaCodeOfficialLogo.png
  font: false
  palette:
    primary: white
    accent: blue
  features:
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - navigation.footer

hooks:
  - hooks/org_chart.py

nav:
  - index.md
  - directory.md
  - org-chart.md
  - barcode.md
  - Departments:
    - departments/index.md
    - departments/music.md
    - departments/art.md
    - departments/ideas.md
    - departments/writing.md
    - departments/qa.md
  - People:
    - harvey.md
    - maxie.md
    - scarlett.md
    - claire.md
    - ch3rry.md
    - amelia.md
    - sabrina.md
    - shay.md
    - rhyse.md
  - Fun:
    - quiz.md

markdown_extensions:
  - pymdownx.details
  - pymdownx.superfences
  - admonition
plugins:
  - search
  - awesome-pages
  - git-revision-date-localized:
      type: date
      enable_creation_date: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/accounts.js
  - javascripts/settings.js
  - javascripts/barcode-core.js
  - javascripts/auth.js
  - javascripts/directory.js
  - javascripts/barcode.js
  - javascripts/quiz.js
